<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2348f5"><meta name="description" content="Practica países y capitales en español y catalán."><title>Países y capitales</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232348f5'/%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='white' stroke-width='2'/%3E%3Cellipse cx='20' cy='20' rx='5' ry='12' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M8 20h24' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script src="d3.min.js" defer></script><script src="data.js" defer></script><script src="app.js" defer></script></head>
<body><header><nav class="tabs" aria-label="Práctica" id="tabs"><button class="tab active" data-mode="map" id="tab-map">Mapa</button><button class="tab" data-mode="choice" id="tab-choice">Capitales · elige</button><button class="tab" data-mode="write" id="tab-write">Capitales · escribe</button></nav><select id="language" aria-label="Idioma"><option value="es">Español</option><option value="ca">Català</option></select></header>
<main><section class="game" id="game"><div class="question-bar"><div class="question"><span id="question-label">Encuentra</span><h1 id="country-name" tabindex="-1"></h1></div><div class="stats"><span id="progress-count">1 / 50</span><strong id="score">—</strong></div></div><div class="progress-track"><div id="progress-fill"></div></div>
<div class="play-area"><div class="map-panel" id="map-panel"><svg id="map" viewBox="0 0 1000 730" aria-label="Mapa de Europa" role="group"></svg><div class="map-controls"><button id="zoom-in" aria-label="Ampliar">+</button><button id="zoom-out" aria-label="Reducir">−</button><button id="zoom-reset" aria-label="Restablecer vista">⌖</button></div></div><div id="capital-panel" class="capital-panel" hidden></div></div>
<div class="game-footer"><div id="feedback" aria-live="polite" aria-atomic="true"></div><button id="skip" class="text-button">No lo sé</button><button id="restart" class="text-button">Nueva ronda</button></div></section></main>
<dialog id="welcome" aria-labelledby="welcome-title"><h2 id="welcome-title" tabindex="-1" autofocus>Idioma / Llengua</h2><div class="welcome-options"><button data-language="es" lang="es" class="secondary">Español</button><button data-language="ca" lang="ca" class="secondary">Català</button></div></dialog>
</body></html>
